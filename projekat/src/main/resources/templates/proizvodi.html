<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>


<title>Admin - Proizvodi</title>

<link rel="stylesheet" th:href="@{/css/style.css}">


</head>

<body>

<a th:href="@{/web}">
    Početna
</a>

<h1>Upravljanje proizvodima</h1>

<!-- PRETRAGA -->

<form th:action="@{/web/proizvodi/pretraga}" method="get">


<input type="text"
       name="naziv"
       placeholder="Pretraga po nazivu">

<button type="submit">
    Pretraži
</button>


<a th:href="@{/web/proizvodi}">
    Reset
</a>


</form>

<!-- FILTAR CENE -->

<form th:action="@{/web/proizvodi/cena}" method="get">


<input type="number"
       step="0.01"
       name="min"
       placeholder="Min cena">


<input type="number"
       step="0.01"
       name="max"
       placeholder="Max cena">


<button type="submit">
    Filtriraj
</button>


</form>

<!-- DODAVANJE / IZMENA PROIZVODA -->

<h2>Dodavanje proizvoda</h2>

<form th:action="${proizvod.id == null} ?
                 @{/web/proizvodi} :
                 @{/web/proizvodi/update/{id}(id=${proizvod.id})}"


  th:object="${proizvod}"

  method="post">


<input type="text"
       th:field="*{naziv}"
       placeholder="Naziv proizvoda"
       required>


<input type="text"
       th:field="*{opis}"
       placeholder="Opis">


<input type="number"
       step="0.01"
       th:field="*{cena}"
       placeholder="Cena"
       required>


<input type="number"
       th:field="*{kolicinaNaLageru}"
       placeholder="Količina"
       required>


<select th:field="*{kategorija}">

    <option value="">
        Izaberi kategoriju
    </option>

    <option th:each="k : ${kategorije}"
            th:value="${k.id}"
            th:text="${k.naziv}">
    </option>

</select>


<button type="submit">
    Sačuvaj
</button>


</form>

<h2>Lista proizvoda</h2>

<table border="1">

<tr>


<th>ID</th>
<th>Naziv</th>
<th>Opis</th>
<th>Cena</th>
<th>Lager</th>
<th>Kategorija</th>
<th>Akcije</th>


</tr>

<tr th:each="p : ${proizvodi}">


<td th:text="${p.id}">
</td>


<td th:text="${p.naziv}">
</td>


<td th:text="${p.opis}">
</td>


<td th:text="${p.cena}">
</td>


<td th:text="${p.kolicinaNaLageru}">
</td>


<td th:text="${p.kategorija != null ? p.kategorija.naziv : ''}">
</td>


<td>



    <!-- OBRISI -->

    <form th:action="@{/web/proizvodi/{id}/obrisi(id=${p.id})}"
          method="post"
          style="display:inline">

        <button type="submit">
            Obriši
        </button>

    </form>




    <!-- DOPUNA LAGERA -->

    <form th:action="@{/web/proizvodi/{id}/lager(id=${p.id})}"
          method="post"
          style="display:inline">

        <input type="number"
               name="kolicina"
               min="1"
               placeholder="+lager"
               required>

        <button type="submit">
            Dopuni
        </button>

    </form>




    <!-- KUPOVINA -->

    <form th:action="@{/web/proizvodi/{id}/kupi(id=${p.id})}"
          method="post"
          style="display:inline">


        <!-- IZBOR KUPCA -->

        <select name="korisnikId" required>

            <option value="">
                Izaberi kupca
            </option>

            <option th:each="k : ${korisnici}"
                    th:value="${k.id}"
                    th:text="${k.email}">
            </option>

        </select>


        <!-- KOLIČINA -->

        <input type="number"
               name="kolicina"
               min="1"
               placeholder="kom"
               required>


        <button type="submit">
            Kupi
        </button>


    </form>


</td>


</tr>

</table>

</body>

</html>
